name: Build and Push to GHCR

on:
  workflow_dispatch:
    inputs:
      image:
        description: "选择要构建的镜像"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - crawler
          - mcp

jobs:
  build-crawler:
    if: github.event.inputs.image == 'all' || github.event.inputs.image == 'crawler'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/nightjoyip/trendradar:latest

  build-mcp:
    if: github.event.inputs.image == 'all' || github.event.inputs.image == 'mcp'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.mcp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/nightjoyip/trendradar-mcp:latest